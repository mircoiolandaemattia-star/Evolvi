name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    # Variabili EXPO_PUBLIC_* (valori pubblici, inlinati nel bundle da Metro):
    # .env/.env.production non sono versionati, quindi senza queste la build
    # non ha la config Supabase/API e l'app va in errore all'avvio.
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Runner macos-26: Xcode default 26.6 (>= 26.4, minimo Expo SDK 57)
      - name: Verifica Xcode
        run: xcodebuild -version

      # postinstall applica il patch di expo-modules-jsi (scripts/patch-jsi.js)
      - name: Dipendenze
        run: npm ci

      # /ios e' in .gitignore: il progetto viene rigenerato qui
      - name: Prebuild iOS
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install

      # Xcode non eredita il PATH di setup-node: indica esplicitamente node
      - name: NODE_BINARY
        run: echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Build .app (non firmato)
        run: |
          xcodebuild \
            -workspace ios/Evolvi.xcworkspace \
            -scheme Evolvi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pacchetta .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Evolvi.app Payload/
          zip -qr Evolvi.ipa Payload
          ls -lh Evolvi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolvi-unsigned
          path: Evolvi.ipa
          if-no-files-found: error
