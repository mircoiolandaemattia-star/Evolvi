name: Keep Render awake

# Render free addormenta il servizio dopo un periodo di inattività e al
# risveglio ci mette ~60 secondi (misurati: 58,4s). Con un ping ogni 10
# minuti il backend resta sveglio e la prima richiesta dell'utente non
# resta appesa un minuto.
# Minuti "sparsi": GitHub esegue le schedule a spareggio e in cima all'ora
# (0, 10, 20...) le run vengono ritardate o saltate del tutto, senza avviso.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Risveglia il backend
        run: |
          url="https://evolvi.onrender.com/api/food-items/lookup?barcode=0000000000000"

          # 401 = servizio sveglio (richiesta senza token respinta dall'auth),
          # 200 = servizio sveglio e cache del codice a barre.
          # 502 = l'istanza si sta ancora riavviando: il ping ha svegliato il
          # servizio ma il proxy di Render risponde prima che la app sia
          # pronta, quindi è atteso e non va segnalato come guasto.
          ok() { [ "$1" = "401" ] || [ "$1" = "200" ]; }

          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
          echo "HTTP ${code}"

          if ! ok "${code}"; then
            echo "Non è ancora pronto: riprovo tra 30 secondi"
            sleep 30
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "HTTP ${code} al secondo tentativo"
          fi

          if ! ok "${code}"; then
            echo "Il backend non ha risposto come previsto"
            exit 1
          fi
